name: CI

on:
  # Both triggers are scoped to main. Left unscoped, a branch with an open PR
  # fires push AND pull_request and runs the whole gate twice for one commit.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a run be fired without inventing a commit, e.g. to re-verify the gate
  # after a workflow or runner-configuration change.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src/iacscanner
      - run: pytest -q

  # The declared dependency floor, installed and tested rather than assumed. A
  # clean resolve always takes the newest python-hcl2, so the lower bound was
  # never exercised: it read >=4.3 while the code needed 8.1.2, and CI was green
  # throughout. Worse than an ImportError, the near misses parse fine and only
  # change the answers - on 8.1.1 a boolean comes back as the string "true", so
  # rules miss real findings and invent false ones. This job pins the exact
  # floors so raising a lower bound without testing it turns CI red.
  floor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pip install "python-hcl2==8.1.3" "pyyaml==6.0.2"
      - run: pip list
      - run: pytest -q

  # The gitleaks binary directly rather than gitleaks-action, and the whole
  # history rather than a diff. The action scans only the range
  # <before>^..<after> that a push touched, so a secret committed earlier and
  # never edited again is never looked at; and on a repository's first push the
  # parent of the root commit does not exist, so it fails outright.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - run: gitleaks detect --source . --redact --exit-code 1 --log-opts=--all
