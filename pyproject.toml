[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iacscanner"
version = "1.2.0"
description = "Defensive, local, read-only Infrastructure-as-Code misconfiguration scanner"
readme = "README.md"
license = { text = "Proprietary source-available - see LICENSE" }
authors = [{ name = "GreenPandaTech" }]
requires-python = ">=3.10"
dependencies = [
    "python-hcl2>=4.3",
    "pyyaml>=6.0",
]
keywords = ["security", "iac", "terraform", "kubernetes", "static-analysis", "misconfiguration"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff", "mypy", "types-PyYAML", "hypothesis>=6.100"]

[project.scripts]
iacscanner = "iacscanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# Rule descriptions/rationale/remediation and IaC test fixtures are long readable prose;
# line length is not hard-enforced (no auto-formatter). All other checks stay on.
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "hcl2.*"
ignore_missing_imports = true
